services:
  - type: web
    name: video-downloader-bot
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TERABOX_COOKIE
        sync: false
      - key: TERABOX_API_URL
        sync: false
      - key: DISKWALA_API_URL
        sync: false
      - key: FLEZEN_API_URL
        sync: false
      - key: PORT
        value: 10000
