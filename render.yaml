services:
  - type: web
    name: video-downloader-bot
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TERABOX_COOKIE
        sync: false
      - key: TERABOX_API_URL
        sync: false
      - key: DISKWALA_API_URL
        sync: false
      - key: FLEZEN_API_URL
        sync: false
      - key: PORT
        value: 10000
